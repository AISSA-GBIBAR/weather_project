<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="CSS/style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


</head>

<body>

    <section class="bg-sun">
        <div class="container-weather changeColor">

            <div class="part-1">
                <span class="overlay changeColor"></span>

                <div class="info z-index-up">
                    <span class="nameDay">------</span>
                    <span class="date">
                       <span class="formatDate">-- --- ----</span>
                    </span>
                    <span class="location"><i class="bi bi-geo-alt"></i> <span class="nameCityCountry">--------, --</span></span>
                </div>

                <div class="info-weather z-index-up">
                    <div class="icon"><img src="" alt="icon_weather" class="image-weather"></div>
                    <div class="temp">
                        <span class="icon-temp">--</span>
                        <span class="tempC">--</span> 
                        <span class="symbol" >°C</span>
                    </div>
                    <div class="desc">----</div>
                </div>

            </div>

            <div class="part-2">

                <div class="info-Day">
                    <div class="precipitation">
                        <span>precipitation</span>
                        <span class="value">-- mm</span>
                    </div>
                    <div class="humidity">
                        <span>humidity</span>
                        <span class="value">-- %</span>
                    </div>
                    <div class="wind">
                        <span>wind</span>
                        <span class="value">-- km/h</span>
                    </div>
                </div>

                <div class="future">

                    <div class="cart cart-1 active">
                        <span class="icon"><i class="bi bi-brightness-high"></i></span>
                        <span class="name-day">---</span>
                        <span class="temp">--°C</span>
                    </div>
                    <div class="cart cart-2">
                        <span class="icon"><i class="bi bi-cloud"></i></span>
                        <span class="name-day">---</span>
                        <span class="temp">--°C</span>
                    </div>
                    <div class="cart cart-1">
                        <span class="icon"><i class="bi bi-cloud-drizzle"></i></span>
                        <span class="name-day">---</span>
                        <span class="temp">--°C</span>
                    </div>
                    <div class="cart cart-1">
                        <span class="icon"><i class="bi bi-cloud-lightning"></i></span>
                        <span class="name-day">---</span>
                        <span class="temp">--°C</span>
                    </div>

                </div>

                <div class="remove-parte-2">
                    <span class="remove-icon"><i class="bi bi-caret-left-fill"></i></span>
                </div>


            </div>

        </div>

        <div class="plus-anther-location">
            <span class="plus-icon"><i class="bi bi-plus"></i></span>
        </div>

        <div class="pop-up-search">
            
            <label for="" class="search-bar">
                <span><i class="bi bi-search"></i></span>
                <input type="text" placeholder="Search for countries" data-search class="changeColor">
            </label>

            <div class="name_city changeColor" >
                <div class="counternar">

                </div>
                <div class="footer-city">
                    
                </div>
            </div>

        </div>

    </section>

    <div class="popUpError hide">
        <div class="arrow-up">
            <img src="img/arrow-up.svg" alt="imge arrow up">
            <img src="img/arrow-up.svg" alt="imge arrow up">
        </div>
        <div class="message">An unexpected error occurred. Check your permissions and try again.</div>
        <div class="box-message-error">
            <div class="title-error"><i class="bi bi-bug-fill"></i> Type of errors </div>
            <div class="message-box">------------------------------------------------</div>
        </div>
        <button class="button-error">Try Again</button>
    </div>

    <script src="JS/app.js" ></script>
    <script src="JS/searchCity.js" defer></script>
    <script src="JS/location.js"></script>
    <script src="JS/fetch_weather.js" ></script>
    <!-- <script src="JS/future_weather.js"></script> -->

</body>

</html>
